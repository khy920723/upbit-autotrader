name: auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    # Only non-draft PRs from this repository's claude/ branches; PRs from forks never qualify.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge (squash) once required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          enabled=$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest -q '.autoMergeRequest != null')
          if [ "$enabled" = "true" ]; then
            echo "Auto-merge is already enabled for #$PR."
          else
            gh pr merge "$PR" --repo "$REPO" --auto --squash
          fi
