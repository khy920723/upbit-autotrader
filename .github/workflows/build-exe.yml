name: build-exe

on:
  workflow_dispatch:
  # Runs on every PR so the required "windows" check always reports; the build
  # itself is skipped when a PR does not touch app or packaging files.
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: spec
        shell: bash
        run: |
          build=false
          if [ -f packaging/autotrader.spec ]; then
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              build=true
            elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(src/|packaging/|pyproject\.toml$|uv\.lock$)'; then
              build=true
            fi
          fi
          echo "exists=$build" >> "$GITHUB_OUTPUT"
          if [ "$build" != true ]; then
            echo "::notice::No app or packaging changes (or no spec yet); skipping the Windows build."
          fi

      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.spec.outputs.exists == 'true'
        with:
          python-version: "3.13"
          enable-cache: true
          ignore-nothing-to-cache: true

      - name: Install dependencies
        if: steps.spec.outputs.exists == 'true'
        run: uv sync --locked

      - name: Windows-only tests (network guard, websocket loopback)
        if: steps.spec.outputs.exists == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q tests/unit/test_network_guard.py tests/integration/test_websocket_loopback.py

      - name: Build with PyInstaller
        if: steps.spec.outputs.exists == 'true'
        run: uv run pyinstaller packaging/autotrader.spec --noconfirm --clean

      - name: Smoke test (--self-test)
        if: steps.spec.outputs.exists == 'true'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\autotrader\autotrader.exe" -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if (Test-Path "self-test-report.txt") { Get-Content "self-test-report.txt" }
          if ($p.ExitCode -ne 0) {
            Write-Error "self-test failed with exit code $($p.ExitCode)"
            exit 1
          }

      - name: Upload build (manual runs only)
        if: steps.spec.outputs.exists == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: autotrader-windows-${{ github.sha }}
          path: dist/autotrader/
          retention-days: 7
          if-no-files-found: error
